<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SETカードゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #1a1a2e; }
  .card { transition: transform 0.1s, box-shadow 0.1s; cursor: pointer; user-select: none; }
  .card:hover { transform: translateY(-2px); }
  .card.selected { box-shadow: 0 0 0 3px #ffd700, 0 4px 20px rgba(255,215,0,0.4); }
  .card.wrong { animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .card.correct { animation: flash 0.4s; }
  @keyframes flash {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body class="min-h-screen text-white p-3">
<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-3">
    <h1 class="text-2xl font-bold text-yellow-300">SET カードゲーム</h1>
    <div class="flex gap-4 text-sm">
      <div class="bg-gray-800 rounded px-3 py-1">
        <span class="text-gray-400">時間: </span>
        <span id="timer" class="text-cyan-300 font-mono">00:00</span>
      </div>
      <div class="bg-gray-800 rounded px-3 py-1">
        <span class="text-gray-400">スコア: </span>
        <span id="score" class="text-green-300 font-mono">0</span>
      </div>
      <div class="bg-gray-800 rounded px-3 py-1">
        <span class="text-gray-400">デッキ: </span>
        <span id="deckCount" class="text-purple-300 font-mono">0</span>
      </div>
    </div>
  </div>

  <div id="message" class="text-center text-lg font-semibold mb-2 h-7 text-yellow-300"></div>

  <div id="board" class="grid grid-cols-4 gap-2 mb-3" role="grid" aria-label="SETカードボード"></div>

  <div class="flex gap-3 flex-wrap justify-center">
    <button id="btnHint" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-semibold text-sm transition" aria-label="ヒント表示">ヒント (-5点)</button>
    <button id="btnNewGame" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-semibold text-sm transition" aria-label="新しいゲーム">新しいゲーム</button>
    <button id="btnDeal" class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded font-semibold text-sm transition" aria-label="3枚追加">3枚追加</button>
    <div class="bg-gray-800 rounded px-3 py-2 text-sm flex items-center gap-2">
      <span class="text-gray-400">SET数:</span>
      <span id="setCount" class="text-green-300 font-mono">0</span>
      <span class="text-gray-400">/ 正解:</span>
      <span id="correct" class="text-yellow-300 font-mono">0</span>
    </div>
  </div>

  <div class="mt-3 bg-gray-800 rounded p-3 text-xs text-gray-400">
    <strong class="text-white">ルール:</strong> 3枚選択し各属性（色・形・塗り・個数）が「全て同じ or 全て異なる」でSET成立。
    色: <span class="text-red-400">赤</span> <span class="text-green-400">緑</span> <span class="text-purple-400">紫</span> ／
    形: 菱形・楕円・波型 ／ 塗り: 空白・縞・塗潰 ／ 個数: 1・2・3
  </div>
</div>

<script>
(function() {
  const COLORS = ['red', 'green', 'purple'];
  const SHAPES = ['diamond', 'oval', 'squiggle'];
  const FILLS = ['empty', 'stripe', 'solid'];
  const COUNTS = [1, 2, 3];

  let deck = [], board = [], selected = [], score = 0, correct = 0;
  let timerInterval = null, startTime = null;

  function createDeck() {
    const d = [];
    for (const c of COLORS) for (const s of SHAPES) for (const f of FILLS) for (const n of COUNTS)
      d.push({ color: c, shape: s, fill: f, count: n });
    return shuffle(d);
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function isSet(a, b, c) {
    const attrs = ['color', 'shape', 'fill', 'count'];
    return attrs.every(attr => {
      const vals = [a[attr], b[attr], c[attr]];
      return (vals[0]===vals[1] && vals[1]===vals[2]) ||
             (vals[0]!==vals[1] && vals[1]!==vals[2] && vals[0]!==vals[2]);
    });
  }

  function findAllSets(cards) {
    const sets = [];
    for (let i = 0; i < cards.length - 2; i++)
      for (let j = i+1; j < cards.length - 1; j++)
        for (let k = j+1; k < cards.length; k++)
          if (isSet(cards[i], cards[j], cards[k])) sets.push([i, j, k]);
    return sets;
  }

  function colorHex(c) {
    return { red: '#ef4444', green: '#22c55e', purple: '#a855f7' }[c];
  }

  function drawShape(shape, fill, color, x, y, w, h) {
    const svg = [];
    const hex = colorHex(color);
    const strokeW = 2;

    if (shape === 'diamond') {
      const path = `M ${x+w/2},${y} L ${x+w},${y+h/2} L ${x+w/2},${y+h} L ${x},${y+h/2} Z`;
      if (fill === 'solid') {
        svg.push(`<path d="${path}" fill="${hex}" stroke="${hex}" stroke-width="${strokeW}"/>`);
      } else if (fill === 'empty') {
        svg.push(`<path d="${path}" fill="none" stroke="${hex}" stroke-width="${strokeW}"/>`);
      } else {
        svg.push(`<defs><clipPath id="cp${x}${y}"><path d="${path}"/></clipPath></defs>`);
        svg.push(`<path d="${path}" fill="none" stroke="${hex}" stroke-width="${strokeW}"/>`);
        for (let sy = y; sy < y+h; sy += 4) {
          svg.push(`<line x1="${x}" y1="${sy}" x2="${x+w}" y2="${sy}" stroke="${hex}" stroke-width="1" clip-path="url(#cp${x}${y})"/>`);
        }
      }
    } else if (shape === 'oval') {
      const rx = w/2, ry = h/2, cx = x+w/2, cy = y+h/2;
      if (fill === 'solid') {
        svg.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${hex}" stroke="${hex}" stroke-width="${strokeW}"/>`);
      } else if (fill === 'empty') {
        svg.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${hex}" stroke-width="${strokeW}"/>`);
      } else {
        svg.push(`<defs><clipPath id="cpe${x}${y}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath></defs>`);
        svg.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${hex}" stroke-width="${strokeW}"/>`);
        for (let sy = y; sy < y+h; sy += 4) {
          svg.push(`<line x1="${x}" y1="${sy}" x2="${x+w}" y2="${sy}" stroke="${hex}" stroke-width="1" clip-path="url(#cpe${x}${y})"/>`);
        }
      }
    } else {
      const path = `M ${x},${y+h*0.3} C ${x+w*0.3},${y} ${x+w*0.4},${y+h*0.1} ${x+w*0.5},${y+h*0.3} C ${x+w*0.6},${y+h*0.5} ${x+w*0.7},${y+h*0.4} ${x+w},${y+h*0.7} C ${x+w*0.7},${y+h} ${x+w*0.6},${y+h*0.9} ${x+w*0.5},${y+h*0.7} C ${x+w*0.4},${y+h*0.5} ${x+w*0.3},${y+h*0.6} ${x},${y+h*0.3} Z`;
      if (fill === 'solid') {
        svg.push(`<path d="${path}" fill="${hex}" stroke="${hex}" stroke-width="${strokeW}"/>`);
      } else if (fill === 'empty') {
        svg.push(`<path d="${path}" fill="none" stroke="${hex}" stroke-width="${strokeW}"/>`);
      } else {
        svg.push(`<defs><clipPath id="cps${x}${y}"><path d="${path}"/></clipPath></defs>`);
        svg.push(`<path d="${path}" fill="none" stroke="${hex}" stroke-width="${strokeW}"/>`);
        for (let sy = y; sy < y+h; sy += 4) {
          svg.push(`<line x1="${x}" y1="${sy}" x2="${x+w}" y2="${sy}" stroke="${hex}" stroke-width="1" clip-path="url(#cps${x}${y})"/>`);
        }
      }
    }
    return svg.join('');
  }

  function cardSVG(card) {
    const W = 100, H = 56;
    const shapeW = 22, shapeH = 34;
    const count = card.count;
    const spacing = count === 1 ? 0 : count === 2 ? 28 : 0;
    const startX = count === 1 ? (W - shapeW)/2 : count === 2 ? (W - shapeW*2 - 8)/2 : (W - shapeW*3 - 16)/2;

    let shapes = '';
    for (let i = 0; i < count; i++) {
      const x = startX + i * (shapeW + 8);
      const y = (H - shapeH) / 2;
      shapes += drawShape(card.shape, card.fill, card.color, x, y, shapeW, shapeH);
    }
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
  }

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    board.forEach((card, idx) => {
      const div = document.createElement('div');
      div.className = 'card bg-white rounded-lg p-2 aspect-video flex items-center justify-center' +
        (selected.includes(idx) ? ' selected' : '');
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', `${card.count}個の${card.color}${card.shape}(${card.fill})`);
      div.setAttribute('tabindex', '0');
      div.innerHTML = cardSVG(card);
      div.addEventListener('click', () => selectCard(idx));
      div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') selectCard(idx); });
      boardEl.appendChild(div);
    });
    document.getElementById('deckCount').textContent = deck.length;
    const sets = findAllSets(board);
    document.getElementById('setCount').textContent = sets.length;
  }

  function selectCard(idx) {
    if (selected.includes(idx)) {
      selected = selected.filter(i => i !== idx);
    } else {
      selected.push(idx);
      if (selected.length === 3) checkSet();
      else renderBoard();
      return;
    }
    renderBoard();
  }

  function showMessage(msg, duration = 1500) {
    const el = document.getElementById('message');
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, duration);
  }

  function checkSet() {
    const [i, j, k] = selected;
    const cards = board.map((_, idx) => idx);
    const a = board[i], b = board[j], c = board[k];
    const boardEl = document.getElementById('board');
    const divs = boardEl.querySelectorAll('.card');

    if (isSet(a, b, c)) {
      selected.forEach(idx => { divs[idx].classList.add('correct'); });
      setTimeout(() => {
        const toRemove = selected.slice().sort((a,b) => b-a);
        toRemove.forEach(idx => {
          if (deck.length > 0) board[idx] = deck.pop();
          else board.splice(idx, 1);
        });
        selected = [];
        score += 10;
        correct++;
        document.getElementById('score').textContent = score;
        document.getElementById('correct').textContent = correct;
        showMessage('✓ SET成立! +10点');
        renderBoard();
      }, 400);
    } else {
      selected.forEach(idx => { divs[idx].classList.add('wrong'); });
      setTimeout(() => {
        selected = [];
        score = Math.max(0, score - 2);
        document.getElementById('score').textContent = score;
        showMessage('✗ SETではありません -2点');
        renderBoard();
      }, 300);
    }
  }

  function newGame() {
    clearInterval(timerInterval);
    deck = createDeck();
    board = [];
    for (let i = 0; i < 12; i++) board.push(deck.pop());
    selected = [];
    score = 0;
    correct = 0;
    document.getElementById('score').textContent = 0;
    document.getElementById('correct').textContent = 0;
    document.getElementById('message').textContent = '';
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    renderBoard();
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }

  document.getElementById('btnNewGame').addEventListener('click', newGame);
  document.getElementById('btnDeal').addEventListener('click', function() {
    if (deck.length >= 3) {
      for (let i = 0; i < 3; i++) board.push(deck.pop());
      renderBoard();
    } else showMessage('デッキが空です');
  });
  document.getElementById('btnHint').addEventListener('click', function() {
    const sets = findAllSets(board);
    if (sets.length > 0) {
      const hint = sets[0];
      selected = [hint[0]];
      score = Math.max(0, score - 5);
      document.getElementById('score').textContent = score;
      showMessage(`ヒント: カード${hint[0]+1}番を選択 (-5点)`);
      renderBoard();
    } else showMessage('現在の場にSETがありません');
  });

  newGame();
})();
</script>
</body>
</html>
